# Static-asset serving for the Flutter web build. SPA fallback so any
# unknown path lands on index.html (the dart router takes over from there).
# Caching: hashed-name asset bundles get long cache, index.html stays
# no-cache so a redeploy is picked up on next page load.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundles (main.dart.js, etc.) — safe to cache aggressively.
    location ~* \.(js|css|woff2?|png|jpg|svg|wasm|json|map)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
