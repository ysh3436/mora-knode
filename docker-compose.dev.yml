# Coordination layer for local + dogfooding. One always-on stack that
# every AI worktree treats as ground truth: in-app tasks, agent tokens,
# plans, work-queue all live in this DB. AI-specific test stacks
# (different `--project-name`, different db name, different ports)
# come later — see docker/README.md.
#
# Default profile = "main". Run with:
#   docker compose -f docker-compose.dev.yml --profile main up
# or just:
#   docker compose -f docker-compose.dev.yml up
#
# Env overrides (in .env or shell):
#   MONGO_DB           default mora_knode_dev
#   BACKEND_PORT       default 5163
#   FRONTEND_PORT      default 8081
#   MONGO_PORT         default 27017
#   MORA_KNODE_API     default http://localhost:${BACKEND_PORT}
#                      (baked into the frontend bundle at build time)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Mongo__ConnectionString=mongodb://mongo:27017
      - Mongo__Database=${MONGO_DB:-mora_knode_dev}
    ports:
      - "${BACKEND_PORT:-5163}:5163"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        MORA_KNODE_API: ${MORA_KNODE_API:-http://localhost:5163}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  mongo-data:
